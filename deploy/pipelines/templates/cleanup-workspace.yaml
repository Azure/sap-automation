steps:
  - bash: |
      set -euo pipefail

      workspace="${PIPELINE_WORKSPACE:?PIPELINE_WORKSPACE is not set}"

      if [[ ! -d "$workspace" ]]; then
        echo "Pipeline workspace '$workspace' does not exist."
        exit 0
      fi

      echo "Cleaning pipeline workspace '$workspace'."
      cd "$workspace"
      cd s/sap-automation
      echo "Cleaning sap-automation directory."
      git clean -fdx

      cd "$workspace"
      cd s/config
      echo "Cleaning config directory."
      git clean -fdx

    displayName: Clean pipeline workspace
    condition: always()
    env:
      PIPELINE_WORKSPACE: $(Pipeline.Workspace)
    workingDirectory: $(Agent.TempDirectory)
