# /*---------------------------------------------------------------------------8
# |                                                                            |
# |                Perform the ANF system mounts                               |
# |                                                                            |
# +------------------------------------4--------------------------------------*/
---

- name:                                "2.6.1 ANF Mount - Set the NFSmount options"
  ansible.builtin.set_fact:
      mnt_options: >-
                                    {%- if ansible_os_family | upper == "REDHAT" -%}
                                      {%- if ansible_distribution_version is version('8.4', '>=') or
                                          ansible_distribution_version is version('9.0', '>=')  or
                                          ansible_distribution_version is version('10.0', '>=') -%}
                                          rw,nfsvers=4.1,hard,timeo=600,rsize=262144,wsize=262144,noatime,lock,_netdev,sec=sys,nconnect=8
                                      {%- else -%}
                                          rw,nfsvers=4.1,hard,timeo=600,rsize=262144,wsize=262144,noatime,lock,_netdev,sec=sys
                                      {%- endif -%}
                                    {%- elif ansible_os_family | upper == "SUSE" -%}
                                      {%- if ansible_distribution_version is version('15.2', '>=') or
                                          ansible_distribution_version is version('16.0', '>=') -%}
                                          rw,nfsvers=4.1,hard,timeo=600,rsize=262144,wsize=262144,noatime,lock,_netdev,sec=sys,nconnect=8
                                      {%- else -%}
                                          rw,nfsvers=4.1,hard,timeo=600,rsize=262144,wsize=262144,noatime,lock,_netdev,sec=sys
                                      {%- endif -%}
                                    {%- else -%}

                                    {%- endif -%}

- name:                                "2.6.1 ANF Mount - Define this SID"
  ansible.builtin.set_fact:
    this_sid:
      {
        'sid': '{{ sap_sid | upper }}',
        'dbsid_uid': '{{ hdbadm_uid }}',
        'sidadm_uid': '{{ sidadm_uid }}',
        'ascs_inst_no': '{{ scs_instance_number }}',
        'pas_inst_no': '{{ pas_instance_number }}',
        'app_inst_no': '{{ app_instance_number }}'
      }

- name:                                "2.6.1 ANF Mount - Create list of all_sap_mounts to support "
  ansible.builtin.set_fact:
    all_sap_mounts:                    "{% if MULTI_SIDS is defined %}{{ MULTI_SIDS }}{% else %}{{ all_sap_mounts | default([]) + [this_sid] }}{% endif %}"
    db_hosts:                          "{{ query('inventory_hostnames', '{{ sap_sid | upper }}_DB') }}"

# /*---------------------------------------------------------------------------8
# |                                                                            |
# |                            Mount the ANF Volumes                           |
# |                                                                            |
# | NFSv4 identity mapping and the nfs_service fact are prepared ahead of every |
# | mount by 2.6.9-nfs-idmap-prep.yaml, imported from main.yaml.                |
# | We use tier in tasks as well, to treat any special scenarios that may arise|
# +------------------------------------4--------------------------------------*/

# /*---------------------------------------------------------------------------8
# |                                                                            |
# |         Prepare for the sap_mnt mounts                                     |
# |         Create temporary directory structure                               |
# |         Mount the share, create the directory structure on share           |
# |         Unmount and clean up temporary directory structure                 |
# |                                                                            |
# +------------------------------------4--------------------------------------*/
- name:                                "2.6.1 ANF Mount - (sapmnt)"
  block:
    - name:                            "2.6.1 ANF Mount - Create /saptmp"
      ansible.builtin.file:
        path:                          "/saptmp"
        state:                         directory
        mode:                          0755
        group:                         sapsys

    - name:                            "2.6.1 ANF Mount - (sapmnt)"
      block:
        - name:                        "2.6.1 ANF Mount - Filesystems on ANF (sapmnt)"
          ansible.posix.mount:
            src:                       "{{ sap_mnt }}"
            path:                      "/saptmp"
            fstype:                    "nfs4"
            opts:                      "rw,hard,rsize=65536,wsize=65536,sec=sys,vers=4.1,tcp"
            state:                     mounted
      rescue:
        - name:                        "2.6.1 ANF Mount - Clear the cache of the nfsidmap daemon (ANF)"
          ansible.builtin.shell: |
                                       nfsidmap -c
        - name:                        "2.6.1 ANF Mount - Ensure the rpcbind service is restarted"
          ansible.builtin.systemd:
            name:                      rpcbind
            daemon-reload:             true
            state:                     restarted

    - name:                            "2.6.1 ANF Mount - Create SAP Directories (spmnt & usrsap)"
      ansible.builtin.file:
        path:                          "{{ item.path }}"
        state:                         directory
        mode:                          0755
      loop:
        - { path: '/saptmp/sapmnt{{ sap_sid | upper }}'                              }
        - { path: '/saptmp/usrsap{{ sap_sid | upper }}'                              }
        - { path: '/saptmp/usrsap{{ sap_sid | upper }}{{ instance_type | lower }}{{ scs_instance_number }}' }
        - { path: '/saptmp/usrsap{{ sap_sid | upper }}ers{{ ers_instance_number }}'  }
        - { path: '/saptmp/usrsap{{ sap_sid | upper }}sys'                           }

    - name:                            "2.6.1 ANF Mount - Create SAP Directories (ANF)"
      ansible.builtin.file:
        path:                          "/saptmp/sapmnt{{ item.sid | upper }}"
        state:                         directory
        mode:                          0755
      loop:                            "{{ MULTI_SIDS }}"
      when:                            MULTI_SIDS is defined

    - name:                            "2.6.1 ANF Mount - Unmount file systems (sap_mnt)"
      ansible.posix.mount:
        src:                           "{{ sap_mnt }}"
        path:                          "/saptmp"
        state:                         unmounted

    - name:                            "2.6.1 ANF Mount - Delete locally created SAP Directories"
      ansible.builtin.file:
        path:                          "{{ item.path }}"
        state:                         absent
      loop:
        - { path: '/saptmp/sapmnt{{ sap_sid | upper }}'                              }
        - { path: '/saptmp/usrsap{{ sap_sid | upper }}'                              }
        - { path: '/saptmp/usrsap{{ sap_sid | upper }}{{ instance_type | lower }}{{ scs_instance_number }}' }
        - { path: '/saptmp/usrsap{{ sap_sid | upper }}ers{{ ers_instance_number }}'  }
        - { path: '/saptmp/usrsap{{ sap_sid | upper }}sys'                           }

    - name:                            "2.6.1 ANF Mount - Remove SAP Directories (ANF)"
      ansible.builtin.file:
        path:                          "/saptmp/sapmnt{{ item.sid | upper }}"
        state:                         absent
      loop:                            "{{ MULTI_SIDS }}"
      when:                            MULTI_SIDS is defined

    - name:                            "2.6.1 ANF Mount - Cleanup fstab and directory (sap_mnt)"
      ansible.posix.mount:
        src:                           "{{ sap_mnt }}"
        path:                          "/saptmp"
        fstype:                        "nfs4"
        opts:                          "rw,hard,rsize=65536,wsize=65536,sec=sys,vers=4.1,tcp"
        state:                         absent

  when:
    - tier == 'sapos'
    - "'scs' in supported_tiers"
    - sap_mnt is defined

# /*---------------------------------------------------------------------------8
# |                                                                            |
# |                Perform the sap_mnt mounts                                  |
# |                Create directories and make them immutable                  |
# |                                                                            |
# +------------------------------------4--------------------------------------*/

- name:                                "2.6.1 ANF Mount - Create SAP Directories (sapmnt)"
  ansible.builtin.file:
    owner:                             "{{ item.sidadm_uid }}"
    group:                             sapsys
    mode:                              0755
    path:                              "/sapmnt/{{ item.sid }}"
    state:                             directory
  register: is_created_now
  loop:                                "{{ all_sap_mounts }}"
  when:
    - tier == 'sapos'
    - node_tier in ['app','scs','ers', 'pas'] or 'scs' in supported_tiers
    - sap_mnt is defined

- name:                                "2.6.1 ANF Mount - Change attribute only when we create SAP Directories (sap_mnt)"
  ansible.builtin.file:
    path:                              "{{ item.item.path }}"
    state:                             directory
    mode:                              0755
    attr:                              i+
  loop: "{{ is_created_now.results }}"
  when:
    - tier == 'sapos'
    - item.item is changed
  register: set_immutable_attribute

- name:                                "2.6.1 ANF Mount - Create SAP Directories (scs & ers)"
  ansible.builtin.file:
    path:                              "{{ item.path }}"
    state:                             directory
    owner:                             '{{ sidadm_uid }}'
    group:                             sapsys
    mode:                              0755
  loop:
    - { path: '/usr/sap/{{ sap_sid | upper }}' }
    - { path: '/usr/sap/{{ sap_sid | upper }}/SYS' }
    - { path: '/usr/sap/{{ sap_sid | upper }}/{{ instance_type | upper }}{{ scs_instance_number }}' }
    - { path: '/usr/sap/{{ sap_sid | upper }}/ERS{{ ers_instance_number }}' }
  when:
    - tier == 'sapos'
    - node_tier in ['scs','ers'] or 'scs' in supported_tiers
    - sap_mnt is defined
    - MULTI_SIDS is undefined
  register: is_created_now3

- name:                                "2.6.1 ANF Mount - Change attribute only when we create SAP Directories (scs & ers)"
  ansible.builtin.file:
    path:                              "{{ item.item.path }}"
    state:                             directory
    mode:                              0755
    attr:                              i+
  loop: "{{ is_created_now3.results }}"
  when:
    - tier == 'sapos'
    - item.item is changed
  register: set_immutable_attribute

- name:                                "2.6.1 ANF Mount - Debug"
  ansible.builtin.debug:
    msg:                               'isHA:{{ scs_high_availability }} | node_tier:{{ node_tier }} | tier:{{ tier }} | sapmnt:{{ sap_mnt }}'

- name:                                "2.6.1 ANF Mount - sapmnt/{{ sap_sid | upper }} - Distributed Non-HA"
  ansible.posix.mount:
    src:                               "{{ item.src }}"
    path:                              "{{ item.path }}"
    fstype:                            "{{ item.type }}"
    opts:                              'rw,hard,rsize=65536,wsize=65536,sec=sys,vers=4.1,tcp'
    state:                             mounted
  loop:
    - { type: 'nfs4',  src: '{{ sap_mnt }}/sapmnt{{ sap_sid | upper }}',    path: '/sapmnt/{{ sap_sid | upper }}'      }
  when:
    - tier == 'sapos'
    - sap_mnt is defined
    - not scs_high_availability
    - ansible_play_hosts_all | length > 1
    - node_tier != 'hana'

- name:                                "2.6.1 ANF Mount - sapmnt/{{ sap_sid | upper }} - Single instance"
  ansible.posix.mount:
    src:                               "{{ item.src }}"
    path:                              "{{ item.path }}"
    fstype:                            "{{ item.type }}"
    opts:                              'rw,hard,rsize=65536,wsize=65536,sec=sys,vers=4.1,tcp'
    state:                             mounted
  loop:
    - { type: 'nfs4',  src: '{{ sap_mnt }}/sapmnt{{ sap_sid | upper }}',    path: '/sapmnt/{{ sap_sid | upper }}'      }
  when:
    - tier == 'sapos'
    - sap_mnt is defined
    - not scs_high_availability
    - ansible_play_hosts_all | length == 1


- name:                                "2.6.1 ANF Mount - sapmnt/{{ sap_sid | upper }} - Standalone MULTI_SIDS"
  become:                              true
  become_user:                         root
  ansible.posix.mount:
    src:                               "{{ sap_mnt }}/sapmnt{{ item.sid }}"
    path:                              "/sapmnt/{{ item.sid }}"
    fstype:                            'nfs4'
    opts:                              'rw,hard,rsize=65536,wsize=65536,sec=sys,vers=4.1,tcp'
    state:                             mounted
  loop:                                "{{ MULTI_SIDS }}"
  when:
    - not scs_high_availability
    - sap_mnt is defined
    - MULTI_SIDS is defined

- name:                                "2.6.1 ANF Mount - sapmnt/{{ sap_sid | upper }} - High Availability"
  ansible.posix.mount:
    src:                               "{{ item.src }}"
    path:                              "{{ item.path }}"
    fstype:                            "{{ item.type }}"
    opts:                              'rw,hard,rsize=65536,wsize=65536,sec=sys,vers=4.1,tcp'
    state:                             mounted
  loop:
    - { type: 'nfs4',  src: '{{ sap_mnt }}/sapmnt{{ sap_sid | upper }}',    path: '/sapmnt/{{ sap_sid | upper }}'      }
  when:
    - scs_high_availability
    - tier in ['sapos']
    - node_tier != 'hana'
    - sap_mnt is defined

- name:                                "2.6.1 ANF Mount - Set Permissons on /sapmnt directory"
  ansible.builtin.file:
    owner:                             '{{ sidadm_uid }}'
    group:                             sapsys
    path:                              "/sapmnt/{{ sap_sid | upper }}"
    state:                             directory
    recurse:                           true

- name:                                "2.6.1 ANF Mount - usr/sap/{{ sap_sid | upper }}/SYS"
  ansible.posix.mount:
    src:                               "{{ item.src }}"
    path:                              "{{ item.path }}"
    fstype:                            "{{ item.type }}"
    opts:                              'rw,hard,rsize=65536,wsize=65536,sec=sys,vers=4.1,tcp'
    state:                             mounted
  loop:
    - { type: 'nfs4',  src: '{{ sap_mnt }}/usrsap{{ sap_sid | upper }}sys', path: '/usr/sap/{{ sap_sid | upper }}/SYS' }
  when:
    - scs_high_availability
    - tier in ['sapos']
    - node_tier in ['scs','ers']
    - sap_mnt is defined


# /*---------------------------------------------------------------------------8
# |                                                                            |
# |         Prepare for the sap_trans, install mounts                                     |
# |         Create temporary directory structure                               |
# |         Mount the share, create the directory structure on share           |
# |         Unmount and clean up temporary directory structure                 |
# |                                                                            |
# +------------------------------------4--------------------------------------*/

- name:                                "2.6.1 ANF Mount - install:Get the Server name list"
  ansible.builtin.set_fact:
    first_server_temp:                 "{{ first_server_temp | default([]) + [item] }}"
  with_items:
    - "{{ query('inventory_hostnames', '{{ sap_sid | upper }}_SCS') }}"
    - "{{ query('inventory_hostnames', '{{ sap_sid | upper }}_DB') }}"

- name:                                "2.6.1 ANF Mount - sap_trans"
  ansible.builtin.include_tasks:       2.6.1.1-anf-mount.yaml
  loop:
    - {
      'type':              'trans',
      'temppath':          'saptrans',
      'mount':             '{{ sap_trans }}',
      'opts':              'rw,hard,rsize=65536,wsize=65536,sec=sys,vers=4.1,tcp',
      'path':              '/usr/sap/trans',
      'permissions':       '0775',
      'set_chattr_on_dir': false,
      'target_nodes':      ['app','pas', 'ers', 'scs'],
      'create_temp_folders': false
    }
  vars:
    primary_host:                     "{{ first_server_temp | first }}"
  when:
    - tier == 'sapos'
    - sap_trans is defined
    - sap_trans != ''

- name:                                "2.6.1 ANF Mount - install"
  ansible.builtin.include_tasks:       2.6.1.1-anf-mount.yaml
  loop:
    - {
      'type':              'install',
      'temppath':          'sapinstall',
      'folder':            '{{ bom_base_name }}',
      'mount':             '{{ usr_sap_install_mountpoint }}',
      'opts':              'rw,hard,rsize=65536,wsize=65536,sec=sys,vers=4.1,tcp',
      'path':              '/usr/sap/install',
      'permissions':       '0775',
      'set_chattr_on_dir': false,
      'target_nodes':      ['all'],
      'create_temp_folders': true
    }
  vars:
    primary_host:                     "{{ first_server_temp | first }}"
  when:
    - tier == 'sapos'
    - usr_sap_install_mountpoint is defined
    - usr_sap_install_mountpoint != ''

...
