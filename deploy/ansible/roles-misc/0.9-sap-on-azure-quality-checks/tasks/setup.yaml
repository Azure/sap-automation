# |                                                                            |
# |                Setup quality check prerequisites                           |
# |                                                                            |
# +------------------------------------4--------------------------------------*/
---

# DEBUG: Show workspace directory
- name:                            "SAP on Azure quality checks: - [DEBUG] Show workspace directory"
  ansible.builtin.debug:
    msg:
                                   - "==================== WORKSPACE CONFIGURATION ==================="
                                   - "Workspace Directory: {{ _workspace_directory }}"
                                   - "Orchestration User: {{ orchestration_ansible_user }}"
                                   - "PowerShell Version: {{ powershell_version }}"
                                   - "================================================================"

- name:                            "SAP on Azure quality checks: - setup directories"
  become:                          true
  become_user:                     root
  ansible.builtin.file:
    path:                          "{{ item.path }}"
    state:                         directory
    mode:                          0755
    owner:                         "{{ item.owner }}"
  loop:
    - { path: "/opt/microsoft/powershell/v{{ powershell_version }}", owner: "root" }
    - { path: "/opt/microsoft/quality_check", owner: "{{ orchestration_ansible_user }}" }
    - { path: "{{ _workspace_directory }}/quality_assurance", owner: "{{ orchestration_ansible_user }}" }

# DEBUG: Verify directories were created
- name:                            "SAP on Azure quality checks: - [DEBUG] Verify directories created"
  ansible.builtin.stat:
    path:                          "{{ item }}"
  register:                        qc_dir_stat
  loop:
    - "/opt/microsoft/powershell/v{{ powershell_version }}"
    - "/opt/microsoft/quality_check"
    - "{{ _workspace_directory }}/quality_assurance"

- name:                            "SAP on Azure quality checks: - [DEBUG] Show directory creation status"
  ansible.builtin.debug:
    msg:
                                   - "==================== DIRECTORY CREATION STATUS ================="
                                   - "{{ item.item }}: {{ 'EXISTS' if item.stat.exists else 'MISSING' }} (owner: {{ item.stat.pw_name | default('N/A') }})"
  loop:                            "{{ qc_dir_stat.results }}"


- name:                            "SAP on Azure quality checks: - extract PowerShell binary"
  become:                          true
  become_user:                     root
  ansible.builtin.unarchive:
    src:                           "https://github.com/PowerShell/PowerShell/releases/download/v{{ powershell_version }}/powershell-{{ powershell_version }}-linux-x64.tar.gz"
    dest:                          "/opt/microsoft/powershell/v{{ powershell_version }}"
    creates:                       "/opt/microsoft/powershell/v{{ powershell_version }}/pwsh"
    remote_src:                    true


- name:                            "SAP on Azure quality checks: - create PowerShell symbolic link"
  become:                          true
  become_user:                     root
  ansible.builtin.file:
    src:                           "/opt/microsoft/powershell/v{{ powershell_version }}/pwsh"
    dest:                          "/usr/local/bin/pwsh"
    state:                         link
    mode:                          0755


- name:                            "SAP on Azure quality checks: - fetch quality check config"
  become:                          true
  become_user:                     root
  ansible.builtin.get_url:
    url:                           "{{ azure_utility_repo }}/main/QualityCheck/QualityCheck.json"
    dest:                          "/opt/microsoft/quality_check/QualityCheck.json"
    owner:                         "{{ orchestration_ansible_user }}"
    mode:                          0755
    timeout:                       30
  register:                        qc_json_result
  until:                           qc_json_result is succeeded or not qc_json_result.changed
  retries:                         2
  delay:                           5


- name:                            "SAP on Azure quality checks: - fetch quality check script"
  become:                          true
  become_user:                     root
  ansible.builtin.get_url:
    url:                           "{{ azure_utility_repo }}/main/QualityCheck/QualityCheck.ps1"
    dest:                          "/opt/microsoft/quality_check/QualityCheck.ps1"
    owner:                         "{{ orchestration_ansible_user }}"
    mode:                          0755
    timeout:                       30
  register:                        qc_ps_result
  until:                           qc_ps_result is succeeded or not qc_ps_result.changed
  retries:                         2
  delay:                           5

- name:                            "SAP on Azure quality checks: - configure PSGallery repository"
  become:                          true
  become_user:                     root
  ansible.builtin.shell: >-
                                   Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
  register:                        qc_psgallery_result
  failed_when:                     qc_psgallery_result.rc != 0
  args:
    chdir:                         "/opt/microsoft/quality_check"
    executable:                    "/usr/local/bin/pwsh"

- name:                            "SAP on Azure quality checks: - Remove old Az module versions (cleanup)"
  become:                          true
  become_user:                     root
  ansible.builtin.shell: |
                                   # List all installed Az.* modules
                                   Write-Host "Checking for existing Az modules..." -ForegroundColor Yellow
                                   $modules = Get-Module -ListAvailable Az* | Select-Object Name, Version

                                   foreach ($mod in $modules) {
                                     Write-Host "Found $($mod.Name) version: $($mod.Version)" -ForegroundColor Cyan
                                   }

                                   # Remove ALL Az modules to start fresh
                                   Write-Host "Removing all Az modules for clean installation..." -ForegroundColor Yellow
                                   Get-Module -ListAvailable Az* | ForEach-Object {
                                     Write-Host "Uninstalling $($_.Name) $($_.Version)..." -ForegroundColor Yellow
                                     Uninstall-Module -Name $_.Name -RequiredVersion $_.Version -Force -ErrorAction SilentlyContinue
                                   }

                                   # Also remove from file system to be certain
                                   $modulePaths = @(
                                     "/usr/local/share/powershell/Modules/Az*",
                                     "/opt/microsoft/powershell/Modules/Az*"
                                   )

                                   foreach ($pathPattern in $modulePaths) {
                                     $paths = Get-ChildItem -Path $pathPattern -Directory -ErrorAction SilentlyContinue
                                     foreach ($path in $paths) {
                                       Write-Host "Removing directory: $($path.FullName)" -ForegroundColor Yellow
                                       Remove-Item -Path $path.FullName -Recurse -Force -ErrorAction SilentlyContinue
                                     }
                                   }

                                   Write-Host "✓ All old Az modules removed" -ForegroundColor Green
  register:                        qc_cleanup_result
  failed_when:                     qc_cleanup_result.rc != 0
  args:
    executable:                    "/usr/local/bin/pwsh"

- name:                            "SAP on Azure quality checks: - [DEBUG] Show Az module cleanup output"
  ansible.builtin.debug:
    msg:
                                   - "==================== AZ MODULE CLEANUP OUTPUT ==================="
                                   - "{{ qc_cleanup_result.stdout_lines | default(['No output']) }}"
                                   - "================================================================="

- name:                            "SAP on Azure quality checks: - install PowerShell modules (version-locked for PS 7.5.4 compatibility)"
  become:                          true
  become_user:                     root
  ansible.builtin.shell: |
                                   # Disable WAM login (not supported in non-interactive scenarios)
                                   # Note: Update-AzConfig may not be available in all Az.Accounts versions
                                   if (Get-Command Update-AzConfig -ErrorAction SilentlyContinue) {
                                     Update-AzConfig -EnableLoginByWam $false -ErrorAction SilentlyContinue
                                   }

                                   # Install Az.Accounts {{ az_accounts_version }} (compatible with PowerShell 7.5.4)
                                   # QualityCheck.ps1 requires Az.NetAppFiles > 0.24.0, which requires Az.Accounts 5.x
                                   # PowerShell 7.5.4 resolved the assembly loading issues present in 7.3.x
                                   Write-Host "Installing Az.Accounts {{ az_accounts_version }} (PowerShell 7.5.4 compatible)..." -ForegroundColor Yellow
                                   Install-Module Az.Accounts -RequiredVersion {{ az_accounts_version }} -Force -Scope AllUsers -AllowClobber -Confirm:$false

                                   # VERIFY only {{ az_accounts_version }} is installed
                                   $installedVersions = Get-Module -ListAvailable Az.Accounts
                                   if ($installedVersions.Count -ne 1) {
                                     Write-Host "ERROR: Multiple Az.Accounts versions found!" -ForegroundColor Red
                                     $installedVersions | ForEach-Object { Write-Host "  - Version: $($_.Version)" -ForegroundColor Red }
                                     throw "Expected only Az.Accounts {{ az_accounts_version }}, but found multiple versions"
                                   }

                                   if ($installedVersions[0].Version -ne "{{ az_accounts_version }}") {
                                     Write-Host "ERROR: Wrong Az.Accounts version installed: $($installedVersions[0].Version)" -ForegroundColor Red
                                     throw "Expected Az.Accounts {{ az_accounts_version }}, but got $($installedVersions[0].Version)"
                                   }

                                   Write-Host "✓ Az.Accounts {{ az_accounts_version }} confirmed as ONLY installed version" -ForegroundColor Green

                                   # Install compatible Az modules that work with Az.Accounts {{ az_accounts_version }}
                                   Write-Host "Installing Az.Compute {{ az_compute_version }}..." -ForegroundColor Yellow
                                   Install-Module Az.Compute -RequiredVersion {{ az_compute_version }} -Force -Scope AllUsers -AllowClobber -Confirm:$false -SkipPublisherCheck

                                   Write-Host "Installing Az.Network {{ az_network_version }}..." -ForegroundColor Yellow
                                   Install-Module Az.Network -RequiredVersion {{ az_network_version }} -Force -Scope AllUsers -AllowClobber -Confirm:$false -SkipPublisherCheck

                                   Write-Host "Installing Az.NetAppFiles {{ az_netappfiles_version }}..." -ForegroundColor Yellow
                                   Install-Module Az.NetAppFiles -RequiredVersion {{ az_netappfiles_version }} -Force -Scope AllUsers -AllowClobber -Confirm:$false -SkipPublisherCheck

                                   Write-Host "Installing Posh-SSH (latest)..." -ForegroundColor Yellow
                                   if (-not (Get-Module -ListAvailable -Name Posh-SSH)) {
                                     Install-Module Posh-SSH -Force -Scope AllUsers -AllowClobber -Confirm:$false -SkipPublisherCheck
                                   }

                                   Write-Host "Verifying module imports..." -ForegroundColor Yellow
                                   Import-Module Az.Accounts -RequiredVersion {{ az_accounts_version }} -ErrorAction Stop
                                   Import-Module Az.Compute -ErrorAction Stop
                                   Import-Module Az.Network -ErrorAction Stop
                                   Import-Module Az.NetAppFiles -ErrorAction Stop
                                   Import-Module Posh-SSH -ErrorAction Stop

                                   # VERIFY Connect-AzAccount is available
                                   if (-not (Get-Command Connect-AzAccount -ErrorAction SilentlyContinue)) {
                                     throw "ERROR: Connect-AzAccount cmdlet not found after importing Az.Accounts {{ az_accounts_version }}"
                                   }

                                   Write-Host "✓ All modules installed and verified successfully" -ForegroundColor Green
                                   Write-Host "✓ Connect-AzAccount cmdlet confirmed available" -ForegroundColor Green
                                   Write-Host "✓ Az.NetAppFiles {{ az_netappfiles_version }} import successful" -ForegroundColor Green
  register:                        qc_modules_result
  failed_when:                     qc_modules_result.rc != 0
  args:
    chdir:                         "/opt/microsoft/quality_check"
    executable:                    "/usr/local/bin/pwsh"

- name:                            "SAP on Azure quality checks: - [DEBUG] Show module installation output"
  ansible.builtin.debug:
    msg:
                                   - "==================== MODULE INSTALLATION OUTPUT ================="
                                   - "{{ qc_modules_result.stdout_lines | default(['No output']) }}"
                                   - "================================================================="

- name:                            "SAP on Azure quality checks: - [DEBUG] Show module installation errors"
  ansible.builtin.debug:
    msg:
                                   - "==================== MODULE INSTALLATION ERRORS ================="
                                   - "{{ qc_modules_result.stderr_lines | default(['No errors']) }}"
                                   - "================================================================="
  when:                            qc_modules_result.stderr is defined and qc_modules_result.stderr != ""
...
