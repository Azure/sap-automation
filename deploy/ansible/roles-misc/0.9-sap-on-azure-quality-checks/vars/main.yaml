azure_utility_repo: https://raw.githubusercontent.com/Azure/SAP-on-Azure-Scripts-and-Utilities
powershell_version: 7.5.4

# PowerShell Az Module Versions (for PowerShell 7.5.4 compatibility)
# PowerShell 7.5.4 supports Az.Accounts 5.x without assembly loading issues
# QualityCheck.ps1 requires Az.NetAppFiles > 0.24.0, which requires Az.Accounts 5.x
# See: https://github.com/Azure/azure-powershell/issues/28495
# Using versions verified to work on deployer VM (manual quality check execution)
az_accounts_version: 5.3.2
az_compute_version: 11.2.0
az_network_version: 7.24.1
az_netappfiles_version: 1.0.0

# https://github.com/Azure/SAP-on-Azure-Scripts-and-Utilities/blob/main/QualityCheck/QualityCheck.ps1
vm_operating_system_map:
  SUSE: "SUSE"
  REDHAT: "RedHat"
  ORACLELINUX: "OracleLinux"
  WINDOWS: "Windows"

vm_database_map:
  HANA: HANA
  DB2: Db2
  SYBASE: ASE
  SQLSERVER: MSSQL
  ORACLE: Oracle
  ORACLE-ASM: Oracle

vm_role_map:
  HANA: DB
  DB2: DB
  SYBASE: DB
  SQLSERVER: DB
  ORACLE: DB
  ORACLE-ASM: DB
  SCS: ASCS
  ERS: ASCS
  PAS: APP
  APP: APP

high_availability_agent_map:
  AFA: FencingAgent
  SBD: SBD
  ISCSI: SBD
