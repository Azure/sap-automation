# Inputs:
#   bom_name              - Name of BOM (ex: S41909SPS03_v0001ms)
#
#
# Outputs:
#   bom                   - object
#

---
# -------------------------------------+---------------------------------------8
#
# Description:  Check if BOM is Microsoft supplied and register BOM as an object.
#               If not, download from storage account location.
#

# -------------------------------------+---------------------------------------8
# Step: 01
# Description:  Create download directory structure
#
- name:                                 "3.3.1 BoM Processing - Create BOM download directories"
  ansible.builtin.file:
    path:                               "{{ item }}"
    state:                              directory
    mode:                               0755
    owner:                              "{{ orchestration_ansible_user if bom_processing_become else omit }}"
  delegate_to:                          localhost
  become:                               "{{ bom_processing_become }}"
  become_user:                          root
  loop:
    - "{{ download_directory }}"
    - "{{ download_directory }}/tmp"
    - "{{ download_directory }}/bom"
    - "{{ download_directory }}/files"
# Step: 01 - END
# -------------------------------------+---------------------------------------8


# -------------------------------------+---------------------------------------8
# Step: 02
# Description:  Set Python version
#
# Step: 02 - END
# -------------------------------------+---------------------------------------8

- name:                                "3.3.1 BoM Processing - Initialize names"
  ansible.builtin.set_fact:
    application_bom_name:              "{{ bom_base_name.split('-')[0] }}"
    database_bom_name:                 "{{ bom_base_name.split('-')[1] | default('')}}"
    kernel_bom_name:                   "{{ bom_base_name.split('-')[2] | default('')}}"
    new_bom_name:                      "{{ bom_base_name.split('-')[3] | default(bom_base_name.split('-')[0]) }}{{ bom_suffix }}"
    bom_dependencies:                  "{{ bom.materials.dependencies | default([]) }}"

- name:                                "3.3.1 BoM Processing - Show new name"
  ansible.builtin.debug:
    msg:
      - "BoM Name:   {{ new_bom_name }}"

# -------------------------------------+---------------------------------------8
# Step: 03
# Description:  Check Storage Account for BOM when SA is enabled
#
- name:                                 "3.3.1 BoM Processing - Check Storage Account for BOM block"
  when:
    - sa_enabled | default(true)                                                 # when true; if not defined, then value is false
  block:

    # ---------------------------------+-------------------------------------------8
    # Step: 03-01
    # Description:
    #
    - name:                             "3.3.1 BoM Processing - Download {{ new_bom_name }} from the storage account"
      ansible.builtin.get_url:
        url:                            "{{ sapbits_location_base_path }}/{{ sapbits_bom_files }}/boms/{{ new_bom_name }}/{{ new_bom_name }}.yaml\
                                        {% if sapbits_sas_token is defined %}?{{ sapbits_sas_token }}{% endif %}"
        dest:                           "{{ download_directory }}/bom/{{ new_bom_name }}.yaml"
        mode:                           0644
        validate_certs:                 false
      delegate_to:                      localhost
      become:                           "{{ bom_processing_become }}"
      ignore_errors:                    true
      register:                         result
    # Step: 03-01 - END
    # ---------------------------------+-------------------------------------------8


    # ---------------------------------+-------------------------------------------8
    # Step: 03-03
    # Description:
    #
    - name:                             "3.3.1 BoM Processing - Show BoM download status"
      ansible.builtin.debug:
        msg:
          - "URL:    {{ sapbits_location_base_path }}/{{ sapbits_bom_files }}/boms/{{ new_bom_name }}/{{ new_bom_name }}.yaml{% if sapbits_sas_token is defined %}?{{ sapbits_sas_token }}{% endif %}"
          - "Result: {{ result }}"
        verbosity:                      2
    # Step: 03-03 - END
    # ---------------------------------+-------------------------------------------8

    # Step: 03 - END
    # ---------------------------------+-------------------------------------------8


# -------------------------------------+---------------------------------------8
# Step: 04
# Description:  Register BOM if found in Storage Account
#
- name:                                 "3.3.1 BoM Processing - Retrieve BOM ({{ bom_name }}) from Storage Account"
  when:
    - result is succeeded or result is skipped
    - sa_enabled | default(false)
  block:

    # ---------------------------------+-------------------------------------------8
    # Step: 04-01
    # Description:
    #
    - name:                             "{{ task_prefix }} Register downloaded BOM ({{ bom_name }})"
      ansible.builtin.include_vars:
        file:                           "{{ download_directory }}/bom/{{ new_bom_name }}.yaml"
        name:                           bom
    # Step: 04-01 - END
    # ---------------------------------+-------------------------------------------8

    # ---------------------------------+-------------------------------------------8
    # Step: 04-02
    # Description:
    #
    - name:                             "{{ task_prefix }} Register downloaded BOM ({{ bom_name }}) file name"
      ansible.builtin.set_fact:
        bom_file:                       "{{ download_directory }}/bom/{{ new_bom_name }}.yaml"
        aggregated_bom_directories:     "{{ aggregated_bom_directories | default([]) + [{'path': path, 'location': 'sa'}] }}"
      vars:
        path:                           "{{ sapbits_location_base_path }}/{{ sapbits_bom_files }}/boms/{{ new_bom_name }}"
    # Step: 04-02 - END
    # ---------------------------------+-------------------------------------------8

    # Step: 04 - END
    # ---------------------------------+-------------------------------------------8

# -------------------------------------+---------------------------------------8
# Step: 05-01
# Description:  Check for Microsoft provided Application BOM from the samples repository
#
- name:                                 "{{ task_prefix }} Check for Microsoft Supplied BOM ({{ application_bom_name }})"
  when:                                 application_bom_name != ''
  block:

    # ---------------------------------+-------------------------------------------8
    # Step: 05-01-01
    # Description:
    #
    - name:                             "{{ task_prefix }} Check for Microsoft Supplied Application BOM ({{ application_bom_name }})"
      ansible.builtin.stat:
        path:                           "{{ BOM_directory }}/{{ application_bom_name }}/{{ application_bom_name }}.yaml"
      register:                         microsoft_supplied_application_bom
      delegate_to:                      localhost
      become:                          "{{ bom_processing_become }}"

    # Step: 05-01-01 - END
    # ---------------------------------+-------------------------------------------8

    # ---------------------------------+-------------------------------------------8
    # Step: 05-02-01
    # Description:
    #
    - name:                             "{{ task_prefix }} Show Microsoft Supplied BOM Application BOM ({{ application_bom_name }}) result"
      ansible.builtin.debug:
        msg: |-
                                        BOM PATH:   {{ BOM_directory }}/{{ application_bom_name }}/{{ application_bom_name }}.yaml
                                        BOM Exists: {{ microsoft_supplied_application_bom.stat.exists }}
        verbosity:                      0
    # Step: 05-02-01 - END
    # ---------------------------------+-------------------------------------------8

    # ---------------------------------+-------------------------------------------8
    # Step: 05-03-01
    # Description:
    #
    - name:                             "{{ task_prefix }} Register Microsoft Supplied Application BOM {{ application_bom_name }}"
      ansible.builtin.include_vars:
        file:                           "{{ microsoft_supplied_application_bom.stat.path }}"
        name:                           application_bom_temp
      when:                             microsoft_supplied_application_bom.stat.exists
    # Step: 05-03-01 - END
    # ---------------------------------+-------------------------------------------8

    # ---------------------------------+-------------------------------------------8
    # Step: 05-04-01
    # Description:
    #
    - name:                             "{{ task_prefix }} Register Microsoft Supplied Application BOM ({{ application_bom_name }}) facts"
      ansible.builtin.set_fact:
        application_bom:                "{{ application_bom_temp }}"
        bom_file:                       "{{ microsoft_supplied_application_bom.stat.path }}"
        aggregated_bom_directories:     "{{ aggregated_bom_directories | default([]) + [{'path': path, 'location': 'local'}] }}"
      vars:
        path:                           "{{ microsoft_supplied_application_bom.stat.path | dirname }}"
      when:                             microsoft_supplied_application_bom.stat.exists
    # Step: 05-04-01 - END
    # ---------------------------------+-------------------------------------------8


# -------------------------------------+---------------------------------------8
# Step: 05-02
# Description:  Check for Microsoft provided database BOM from the samples repository
#
- name:                                 "{{ task_prefix }} Check for Microsoft Supplied BOM ({{ database_bom_name }})"
  when:                                 database_bom_name != ''
  block:

    # ---------------------------------+-------------------------------------------8
    # Step: 05-02-01
    # Description:
    #
    - name:                             "{{ task_prefix }} Check for Microsoft Supplied Database BOM ({{ database_bom_name }})"
      ansible.builtin.stat:
        path:                           "{{ BOM_directory }}/{{ database_bom_name }}/{{ database_bom_name }}.yaml"
      register:                         microsoft_supplied_database_bom
      delegate_to:                      localhost
      become:                          "{{ bom_processing_become }}"

    # Step: 05-02-01 - END
    # ---------------------------------+-------------------------------------------8

    # ---------------------------------+-------------------------------------------8
    # Step: 05-02-02
    # Description:
    #
    - name:                             "{{ task_prefix }} Show Microsoft Supplied BOM Database BOM ({{ database_bom_name }}) result"
      ansible.builtin.debug:
        msg: |-
                                        BOM PATH:   {{ BOM_directory }}/{{ database_bom_name }}/{{ database_bom_name }}.yaml
                                        BOM Exists: {{ microsoft_supplied_database_bom.stat.exists }}
        verbosity:                      0
    # Step: 05-02-02 - END
    # ---------------------------------+-------------------------------------------8

    # ---------------------------------+-------------------------------------------8
    # Step: 05-02-03
    # Description:
    #
    - name:                             "{{ task_prefix }} Register Microsoft Supplied Database BOM {{ database_bom_name }}"
      ansible.builtin.include_vars:
        file:                           "{{ microsoft_supplied_database_bom.stat.path }}"
        name:                           database_bom_temp
      when:                             microsoft_supplied_database_bom.stat.exists
    # Step: 05-02-03 - END
    # ---------------------------------+-------------------------------------------8

    # ---------------------------------+-------------------------------------------8
    # Step: 05-02-04
    # Description:
    #
    - name:                             "{{ task_prefix }} Register Microsoft Supplied Database BOM ({{ database_bom_name }}) facts"
      ansible.builtin.set_fact:
        database_bom:                   "{{ database_bom_temp }}"
        bom_file:                       "{{ microsoft_supplied_database_bom.stat.path }}"
        aggregated_bom_directories:     "{{ aggregated_bom_directories | default([]) + [{'path': path, 'location': 'local'}] }}"
      vars:
        path:                           "{{ microsoft_supplied_database_bom.stat.path | dirname }}"
      when:                             microsoft_supplied_database_bom.stat.exists
    # Step: 05-02-04 - END
    # ---------------------------------+-------------------------------------------8


# -------------------------------------+---------------------------------------8
# Step: 05-03
# Description:  Check for Microsoft provided kernel BOM from the samples repository
#
- name:                                 "{{ task_prefix }} Check for Microsoft Supplied Kernel BOM ({{ kernel_bom_name }})"
  when:                                 kernel_bom_name != ''
  block:
      # ---------------------------------+-------------------------------------------8
      # Step: 05-03-01
      # Description:
      #
    - name:                             "{{ task_prefix }} Check for Microsoft Supplied kernel BOM ({{ kernel_bom_name }})"
      ansible.builtin.stat:
        path:                           "{{ BOM_directory }}/{{ kernel_bom_name }}/{{ kernel_bom_name }}.yaml"
      register:                         microsoft_supplied_kernel_bom
      delegate_to:                      localhost
      become:                          "{{ bom_processing_become }}"

    # Step: 05-03-01 - END
    # ---------------------------------+-------------------------------------------8

    # ---------------------------------+-------------------------------------------8
    # Step: 05-03-02
    # Description:
    #
    - name:                             "{{ task_prefix }} Show Microsoft Supplied BOM Kernel BOM ({{ kernel_bom_name }}) result"
      ansible.builtin.debug:
        msg: |-
                                        BOM PATH:   {{ BOM_directory }}/{{ kernel_bom_name }}/{{ kernel_bom_name }}.yaml
                                        BOM Exists: {{ microsoft_supplied_kernel_bom.stat.exists }}
        verbosity:                      0
    # Step: 05-03-02 - END
    # ---------------------------------+-------------------------------------------8

    # ---------------------------------+-------------------------------------------8
    # Step: 05-03-03
    # Description:
    #
    - name:                             "{{ task_prefix }} Register Microsoft Supplied Kernel BOM {{ kernel_bom_name }}"
      ansible.builtin.include_vars:
        file:                           "{{ microsoft_supplied_kernel_bom.stat.path }}"
        name:                           kernel_bom_temp
      when:                             microsoft_supplied_kernel_bom.stat.exists
    # Step: 05-03-03 - END
    # ---------------------------------+-------------------------------------------8

    # ---------------------------------+-------------------------------------------8
    # Step: 05-04-03
    # Description:
    #
    - name:                             "{{ task_prefix }} Register Microsoft Supplied Kernel BOM ({{ kernel_bom_name }}) facts"
      ansible.builtin.set_fact:
        kernel_bom:                     "{{ kernel_bom_temp }}"
        kernel_bom_file:                "{{ microsoft_supplied_kernel_bom.stat.path }}"
        aggregated_bom_directories:     "{{ aggregated_bom_directories | default([]) + [{'path': path, 'location': 'local'}] }}"
      vars:
        path:                           "{{ microsoft_supplied_kernel_bom.stat.path | dirname }}"
      when:                             microsoft_supplied_kernel_bom.stat.exists

    # Step: 05-03-03 - END
    # ---------------------------------+-------------------------------------------8

# -------------------------------------+---------------------------------------8
# Step: 05-05
# Description:
#
- name:                             "{{ task_prefix }} Check for Microsoft Supplied BOM ({{ bom_name }}) in archives"
  when:                             not microsoft_supplied_application_bom.stat.exists
  block:

    # -------------------------------------+---------------------------------------8
    # Step: 05-05-01
    # Description:
    #
    - name:                         "{{ task_prefix }} Check for Microsoft Supplied BOM ({{ bom_name }}) in archives"
      ansible.builtin.stat:
        path:                       "{{ BOM_directory }}/archives/{{ bom_name }}/{{ bom_name }}.yaml"
      register:                     microsoft_supplied_bom_archive
      delegate_to:                  localhost
      become:                       "{{ bom_processing_become }}"
    # Step: 05-05-01 - END
    # -------------------------------------+---------------------------------------8

    # -------------------------------------+---------------------------------------8
    # Step: 05-05-02
    # Description:
    #
    - name:                         "{{ task_prefix }} Register Microsoft Supplied BOM {{ bom_name }} from archives"
      ansible.builtin.include_vars:
        file:                       "{{ microsoft_supplied_bom_archive.stat.path }}"
        name:                       bom_temp
      when:                         microsoft_supplied_bom_archive.stat.exists
    # Step: 05-05-02 - END
# -------------------------------------+---------------------------------------8

# -------------------------------------+---------------------------------------8
# Step: 05-05-03
# Description:
#
    - name:                         "{{ task_prefix }} Register Microsoft Supplied BOM ({{ bom_name }}) facts"
      ansible.builtin.set_fact:
        bom:                        "{{ bom_temp }}"
        bom_file:                   "{{ microsoft_supplied_bom_archive.stat.path }}"
        aggregated_bom_directories: "{{ aggregated_bom_directories | default([]) + [{'path': path, 'location': 'local'}] }}"
      vars:
        path:                       "{{ microsoft_supplied_bom_archive.stat.path | dirname }}"
      when:                         microsoft_supplied_bom_archive.stat.exists
# Step: 05-05-03 - END
# -------------------------------------+---------------------------------------8

# Step: 05-05 - END
# -------------------------------------+---------------------------------------8

# Step: 05 - END
# -------------------------------------+---------------------------------------8

- name:                                 "{{ task_prefix }} Show Application, Database, and Kernel BOMs"
  ansible.builtin.debug:
    msg:
      - "Application BoM: {{ bom }}"
      - "Database BoM:    {{ database_bom | default('Not defined') }}"
      - "Kernel BoM:      {{ kernel_bom | default('Not defined') }}"

- name:                                 "{{ task_prefix }} Merge Application, Database, and Kernel BOMs into main BOM"
  ansible.builtin.set_fact:
    bom:                                "{{ application_bom }}"
    merged_yaml:                        "{{ merged_yaml | combine({'materials': {'media': application_bom.materials.media + database_bom.materials.media +kernel_bom.materials.media }}, recursive=true) }}"


- name:                                 "{{ task_prefix }} Show Application, Database, and Kernel BOMs"
  ansible.builtin.debug:
    msg:
      - "Merged Materials: {{ merged_yaml }}"



# -------------------------------------+---------------------------------------8
# Step: 06
# Description:  Validate that BoM was found
#

- name:                                 "{{ task_prefix }} Show BOM object"
  ansible.builtin.debug:
    var:                                bom
    verbosity:                          0

- name:                                 "{{ task_prefix }} Validate that a BOM object is created"
  ansible.builtin.fail:
    msg:                                "Unable to find the Bill of materials file for {{ bom_name }}."
  when:                                 bom is not defined
# Step: 06 - END
# -------------------------------------+---------------------------------------8


# -------------------------------------+---------------------------------------8
# Step: 07
# Description:  Show BOM detail
#
- name:                                 "{{ task_prefix }} Show BOM details"
  ansible.builtin.debug:
    msg:
      - "BoM name:        {{ bom.name }}"
      - "BoM target:      {{ bom.target }}"
      - "BoM version:     {{ bom.version }}"
      - "BoM DB platform: {% if bom.platform is defined %}{{ bom.platform }}{% else %}Not defined{% endif %}"
      - "Instance type:   {% if bom.InstanceType is defined %}{{ bom.InstanceType }}{% else %}Not defined{% endif %}"
  when:
    - bom.name is not search('SWPM')
    - bom.name is not search('SUM')
# Step: 07 - END
# -------------------------------------+---------------------------------------8


# -------------------------------------+---------------------------------------8
# Step: 08
# Description:  Validate that BoM was found
#
