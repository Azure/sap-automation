---
# /*---------------------------------------------------------------------------8
# |                                                                            |
# |               Task: 1.4       - Package Installation for OS                |
# |                                                                            |
# +------------------------------------4--------------------------------------*/


- name:                                "1.4 Packages - REDHAT - Check if /etc/init.d exists"
  ansible.builtin.stat:
    path:                              /etc/init.d
  register:                            initd_dir

- name:                                "1.4 Packages - REDHAT - Check if the OS version is RHEL 9.0 or newer and if init.d exists"
  ansible.builtin.set_fact:
    is_rhel_90_or_newer:               "{{ ansible_distribution_version is version('9.0', '>=') | default(false) }}"
    init_d_exists:                     "{{ initd_dir.stat.exists }}"
    rpm_list:                          "{{ ('rhel-%s-for-x86_64-highavailability-rpms,codeready-builder-for-rhel-%s-x86_64-rpms' | format(ansible_distribution_major_version, ansible_distribution_major_version)) if (ansible_distribution == 'RedHat' and (ansible_distribution_major_version | int) >= 8) else [] }}"
  when:                                ansible_os_family | upper == 'REDHAT'

- name:                                "1.4 Packages - REDHAT - Copy /etc/init.d"
  ansible.builtin.copy:
    remote_src:                        true
    src:                               /etc/init.d
    dest:                              /etc/init.d_bckp
    mode:                              preserve
    directory_mode:                    preserve
  register:                            initd_copy
  when:
    - is_rhel_90_or_newer
    - init_d_exists

- name:                                "1.4 Packages - REDHAT - Remove /etc/init.d"
  ansible.builtin.file:
    path:                              /etc/init.d
    state:                             absent
  when:
    - is_rhel_90_or_newer
    - init_d_exists

# /*----------------------------------------------------------------------------8
# |                                    END                                      |
# +------------------------------------4---------------------------------------*/
