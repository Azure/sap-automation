# /*---------------------------------------------------------------------------8
# |                                                                            |
# |     This workflow builds the SAP Container Image with GitHub Actions       |
# |                                                                            |
# +------------------------------------4--------------------------------------*/

name: Build image

on:
  push:
    branches:
      - main
      - "development-*"
      - "release/**"
    tags:
      - "v*.*.*.*"
  pull_request:
    branches:
      - main
      - "development-*"
      - "release/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Determine package versions
        id: versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          yq_version=$(gh api https://api.github.com/repos/mikefarah/yq/releases/latest | jq '.name' -r)
          echo "yq=$yq_version" >> "$GITHUB_OUTPUT"

          tf_version=$(curl -s https://releases.hashicorp.com/terraform/index.json | jq -r '.versions | keys[]' | grep -Ev 'alpha|beta|rc' | sort -V | tail -n 1)
          echo "tf=${tf_version}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build Docker image (validation only)
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            YQ_VERSION=${{ steps.versions.outputs.yq }}
            TF_VERSION=${{ steps.versions.outputs.tf }}
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:validation
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate Docker image
        run: |
          echo "Validating Docker image..."
          docker images "${{ env.IMAGE_NAME }}:validation"
          docker run --rm "${{ env.IMAGE_NAME }}:validation" terraform version
          docker run --rm "${{ env.IMAGE_NAME }}:validation" ansible --version
          docker run --rm "${{ env.IMAGE_NAME }}:validation" az version
          echo "Docker image validation successful"

  push:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Determine package versions
        id: versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          yq_version=$(gh api https://api.github.com/repos/mikefarah/yq/releases/latest | jq '.name' -r)
          echo "yq=$yq_version" >> "$GITHUB_OUTPUT"

          tf_version=$(curl -s https://releases.hashicorp.com/terraform/index.json | jq -r '.versions | keys[]' | grep -Ev 'alpha|beta|rc' | sort -V | tail -n 1)
          echo "tf=${tf_version}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=ref,event=tag,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=release,enable=${{ startsWith(github.ref, 'refs/heads/release/') }}
            type=raw,value=${{ github.sha }}

      - name: Build and push Docker image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            YQ_VERSION=${{ steps.versions.outputs.yq }}
            TF_VERSION=${{ steps.versions.outputs.tf }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        run: |
          echo "Image pushed to GHCR with tags:"
          echo "${{ steps.meta.outputs.tags }}"
