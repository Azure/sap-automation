
name: Ansible Lint
on: [push, pull_request]
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout the code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 #v6.2.0
        with:
          python-version: '3.10'

      - name: Install Ansible and Ansible-Lint
        run: |
          python -m pip install --upgrade pip==24.3.1
          pip install ansible-core==2.16.14 ansible-lint==24.9.2 jmespath==1.0.1 netaddr==1.3.0

      - name: Install Ansible Collections
        run: |
          ansible-galaxy collection install ansible.windows:3.7.0 --force
          ansible-galaxy collection install ansible.posix:2.2.1 --force
          ansible-galaxy collection install azure.azcollection --force
          ansible-galaxy collection install ansible.utils --force
          ansible-galaxy collection install ansible.netcommon:5.1.2 --force
          ansible-galaxy collection install community.windows --force
          ansible-galaxy collection install community.general:11.4.1 --force
          ansible-galaxy collection install microsoft.ad --force

      - name: Run ansible-lint
        run: |
          ansible-lint deploy/ansible -c .ansible-lint

      - name: Install Python test dependencies
        run: |
          pip install -r requirements-test.txt

      - name: Check Black formatting
        run: |
          black --check tests/ deploy/

      - name: Run Python tests with coverage
        run: |
          python -m pytest
