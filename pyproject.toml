[tool.black]
line-length = 100
target-version = ["py310"]
include = '\.pyi?$'
extend-exclude = '''
/(
  \.venv
  | \.git
  | Webapp
)/
'''

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = [
  # Repository root: enables full dotted-path imports, e.g.
  # "deploy.ansible.filter_plugins.custom_filters", via PEP 420 implicit
  # namespace packages (no __init__.py files needed in production dirs).
  ".",
  # These two source directories contain hyphens/dots in their path segments
  # (e.g. "roles-sap-os", "2.4-hosts-file", "SDAF-GitHub-Actions"), which are
  # not valid in a dotted Python import path. They are added directly so
  # their modules/packages can still be imported by bare name.
  "deploy/ansible/roles-sap-os/2.4-hosts-file/filter_plugins",
  "deploy/scripts/py_scripts/SDAF-GitHub-Actions",
]
addopts = "--cov --cov-report=term-missing --cov-fail-under=85"

[tool.pyright]
# Mirror the pytest ``pythonpath`` entries above so editors/static analysis
# resolve the same modules the test suite imports at runtime.
extraPaths = [
  ".",
  "deploy/ansible/roles-sap-os/2.4-hosts-file/filter_plugins",
  "deploy/scripts/py_scripts/SDAF-GitHub-Actions",
]
exclude = [
  "**/.venv",
  "**/__pycache__",
  "Webapp",
]

# ansible-core's ``LookupBase.run`` is an abstract stub whose body is ``pass``
# and which carries no return annotation, so static analysis infers its return
# type as ``None``. The Ansible lookup-plugin contract requires ``run`` to return
# a list, so every lookup plugin necessarily widens that inferred type. The rule
# is disabled for this directory only; it stays active everywhere else.
[[tool.pyright.executionEnvironments]]
root = "deploy/ansible/lookup_plugins"
reportIncompatibleMethodOverride = "none"

[tool.coverage.run]
source = [
  "deploy/ansible/filter_plugins",
  "deploy/ansible/lookup_plugins",
  "deploy/ansible/roles-sap-os/2.4-hosts-file/filter_plugins",
  "deploy/scripts/py_scripts/SDAF-GitHub-Actions",
]
omit = [
  "*/tests/*",
  "*/.venv/*",
]

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
]
